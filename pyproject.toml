[project]
name = "munshi"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "shivam-kumar25", email = "shivamkumargupta250904@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beancount>=3.2.3",
    "httpx>=0.28.1",
    "neatlogs>=1.4.26",
    "openai>=3.28.0",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "streamlit>=1.65.0",
]

[project.scripts]
munshi = "munshi:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
